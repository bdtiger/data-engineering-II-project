<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Star Predictor{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      color: #222;
      min-height: 100vh;
    }

    nav {
      background: #1a1a2e;
      padding: 0 2rem;
      display: flex;
      align-items: center;
      gap: 0;
    }

    nav .brand {
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
      padding: 1rem 1.5rem 1rem 0;
      margin-right: 1rem;
      border-right: 1px solid #333;
      white-space: nowrap;
    }

    nav a {
      color: #bbb;
      text-decoration: none;
      padding: 1rem 1rem;
      font-size: 0.9rem;
      display: inline-block;
      transition: color 0.15s, background 0.15s;
    }

    nav a:hover,
    nav a.active {
      color: #fff;
      background: rgba(255,255,255,0.07);
    }

    nav a.active {
      border-bottom: 2px solid #6c8ebf;
    }

    .container {
      max-width: 900px;
      margin: 2.5rem auto;
      padding: 0 1.5rem;
    }

    h1 { font-size: 1.5rem; margin-bottom: 0.4rem; }
    h2 { font-size: 1.2rem; margin-bottom: 1rem; color: #444; }

    .card {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 1.5rem 2rem;
      margin-bottom: 1.5rem;
    }

    .subtitle {
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    button, input[type="submit"] {
      background: #1a1a2e;
      color: #fff;
      border: none;
      padding: 0.6rem 1.4rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    button:hover, input[type="submit"]:hover {
      background: #2e2e50;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    th {
      background: #f0f0f0;
      text-align: left;
      padding: 0.6rem 0.8rem;
      border-bottom: 2px solid #ddd;
      font-weight: 600;
    }

    td {
      padding: 0.5rem 0.8rem;
      border-bottom: 1px solid #eee;
    }

    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafafa; }

    .stat {
      font-size: 2rem;
      font-weight: 700;
      color: #1a1a2e;
      margin: 0.5rem 0;
    }

    .stat-label {
      font-size: 0.85rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .table-wrap {
      overflow-x: auto;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

<nav>
  <span class="brand">Star Predictor</span>
  <a href="/" {% if active == 'home' %}class="active"{% endif %}>Home</a>
  <a href="/accuracy" {% if active == 'accuracy' %}class="active"{% endif %}>Accuracy</a>
  <a href="/predictions" {% if active == 'predictions' %}class="active"{% endif %}>Predictions</a>
</nav>

<div class="container">
  {% block content %}{% endblock %}
</div>

</body>
</html>
