- hosts: all

  tasks:

   - name: Generate hosts file
     lineinfile: dest=/etc/hosts
                 regexp='.*{{ item }}$'
                 line="{{ hostvars[item].ansible_default_ipv4.address }} {{item}}"
                 state=present
     when: hostvars[item].ansible_default_ipv4.address is defined
     with_items: "{{groups['all']}}"
     become: true

   - name: apt update
     apt: update_cache=yes upgrade=dist
     become: true

   - name: Install common packages
     apt:
      pkg:
       - git
       - python3-pip
       - python3-venv
      state: latest
      update_cache: true
     become: true

   - name: Clone project repo
     become: true
     git:
      repo: 'https://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@github.com/bdtiger/data-engineering-II-project.git'
      dest: /data-engineering-II-project
      force: yes

   - name: Set ownership of project directory
     become: true
     file:
      path: /data-engineering-II-project
      state: directory
      recurse: yes
      owner: appuser
      group: appuser


# ── Dev server ────────────────────────────────────────────────────────────────
# Runs the GitHub crawler and model training directly (no Docker needed).
# Packages: requests + pandas for the crawler, scikit-learn + joblib + numpy
# for training. Also sets up the bare git repo and SSH key for the CI/CD hook.

- hosts: devserver

  tasks:
   - name: Install crawler and training packages
     become: true
     pip:
      name:
       - requests
       - pandas
       - scikit-learn
       - joblib
       - numpy
      executable: pip3

   - name: Create working git staging repo on dev
     become: true
     become_user: appuser
     shell: |
      mkdir -p /home/appuser/my_project
      cd /home/appuser/my_project
      git init
     args:
      creates: /home/appuser/my_project/.git/HEAD

   - name: Generate SSH keypair on dev (used to push model to prod)
     become: true
     become_user: appuser
     shell: ssh-keygen -t rsa -b 4096 -N "" -f /home/appuser/.ssh/id_rsa
     args:
      creates: /home/appuser/.ssh/id_rsa

   - name: Read dev public key
     become: true
     slurp:
      src: /home/appuser/.ssh/id_rsa.pub
     register: dev_pubkey

   - name: Add production remote pointing at prod bare repo
     become: true
     become_user: appuser
     shell: |
      cd /home/appuser/my_project
      git remote get-url production 2>/dev/null || \
      git remote add production appuser@{{ hostvars['prodserver']['ansible_host'] }}:/home/appuser/my_project
     ignore_errors: true


# ── Prod server ───────────────────────────────────────────────────────────────
# Runs the ci_cd/production_server docker-compose stack from the repo.
# Stack: RabbitMQ 3.12 + Celery worker (ci_cd/production_server/workerA.py).
# best_model.pkl is SCP'd here by the Git hook and loaded by the worker.

- hosts: prodserver

  tasks:
   - name: Install packages required before adding Docker repo
     apt:
      pkg:
       - apt-transport-https
       - ca-certificates
       - curl
       - software-properties-common
      state: latest
      update_cache: true
     become: true

   - name: Create Docker config directory
     become: true
     file:
      path: /etc/docker
      state: directory

   # MTU fix: SNIC network MTU is 1450, Docker default is 1500.
   # Without this, pip installs inside containers silently hang or fail.
   - name: Set Docker MTU to match SNIC (1450)
     become: true
     copy:
      dest: /etc/docker/daemon.json
      content: |
       {
         "mtu": 1450
       }

   - name: Add Docker GPG key
     apt_key:
      url: https://download.docker.com/linux/ubuntu/gpg
      state: present
     become: true

   - name: Add Docker apt repository for Ubuntu 22.04 (jammy)
     apt_repository:
      repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu jammy stable"
      state: present
     become: true

   - name: Install Docker CE
     apt:
      pkg: docker-ce
      state: present
      update_cache: true
     become: true

   - name: Add appuser to docker group
     user:
      name: appuser
      groups: docker
      append: yes
     become: true

   - name: Authorize dev public key on prod
     become: true
     become_user: appuser
     authorized_key:
      user: appuser
      state: present
      key: "{{ hostvars['devserver']['dev_pubkey']['content'] | b64decode }}"

   - name: Create bare git repo for CI/CD hook on prod
     become: true
     become_user: appuser
     shell: |
      mkdir -p /home/appuser/my_project
      cd /home/appuser/my_project
      git init --bare
     args:
      creates: /home/appuser/my_project/HEAD

   - name: Create post-receive git hook on prod
     become: true
     become_user: appuser
     copy:
      dest: /home/appuser/my_project/hooks/post-receive
      content: |
       #!/bin/bash
       while read oldrev newrev ref
       do
         if [[ $ref =~ .*/master$ ]];
         then
           echo "Master ref received. Deploying master branch to production..."
           git --work-tree=/data-engineering-II-project/ci_cd/production_server \
               --git-dir=/home/appuser/my_project checkout -f
         else
           echo "Ref $ref successfully received. Doing nothing: only the master branch may be deployed on this server."
         fi
       done

   - name: Make post-receive hook executable
     become: true
     become_user: appuser
     file:
      path: /home/appuser/my_project/hooks/post-receive
      mode: '0755'

   - name: Start production containers
     become: true
     shell: docker compose up -d
     args:
      chdir: /data-engineering-II-project/ci_cd/production_server
